name: Python CI & Wheel Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 ugreen_nas --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ugreen_nas --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Import sanity check
        run: |
          python -c "import ugreen_nas; print('ugreen_nas version:', ugreen_nas.__version__, 'exports:', len(ugreen_nas.__all__))"

  build-wheel:
    name: Build Wheel & Source Distribution
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Wheel (.whl) and sdist (.tar.gz)
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify installing built Wheel
        run: |
          pip install dist/*.whl
          python -c "import ugreen_nas; from ugreen_nas import UgreenNasClient, FanMode; print('Installed wheel verified:', ugreen_nas.__version__)"

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugreen-nas-python-wheel
          path: |
            dist/*.whl
            dist/*.tar.gz
